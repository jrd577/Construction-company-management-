<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Join Crewboard</title>
<style>
:root{--bg:#ECEEEF;--surface:#fff;--ink:#17232C;--ink-2:#55636E;--line:#D7DCDF;--bar:#14293A;--primary:#1E3A4C;--accent:#F2B01E;--danger:#B3261E;--ok:#17754B}
@media(prefers-color-scheme:dark){:root{--bg:#0F161B;--surface:#172028;--ink:#E6ECEF;--ink-2:#9BA9B3;--line:#2A3640;--bar:#0A1218;--primary:#6FB1D6;--danger:#F28B82;--ok:#58D49A}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",sans-serif}
header{background:var(--bar);color:#fff;padding:14px 16px 0}header b{font-size:22px}
.tabs{display:flex;gap:4px;margin-top:8px}.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:#fff;opacity:.7;font:600 15px sans-serif;padding:10px 6px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.tabs button[aria-selected=true]{opacity:1;border-color:var(--accent)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0 0 4px}p.sub{color:var(--ink-2);margin:0 0 16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px}
label{display:grid;gap:4px;font-weight:600;font-size:14px}
input,select,textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:6px}
.btn{font:600 15px sans-serif;padding:11px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.p{background:var(--primary);border-color:var(--primary);color:#fff}.btn:disabled{opacity:.5}
.err{color:var(--danger);min-height:1em;font-size:13px}.done{background:var(--surface);border:1px solid var(--ok);border-radius:8px;padding:20px;text-align:center}
.hp{position:absolute;left:-9999px}[hidden]{display:none!important}
.chk{display:flex;gap:8px;align-items:center;font-weight:500}.chk input{width:auto}
</style></head><body>
<header><b>Crewboard</b>
<div class="tabs" role="tablist"><button role="tab" data-t="worker" aria-selected="true">Join as worker</button><button role="tab" data-t="supplier" aria-selected="false">Join as supplier</button></div></header>
<main>
<section id="done" class="done" hidden><h1>You're in</h1><p>Thanks. The manager will review your details and contact you.</p><button class="btn" id="again">Register another</button></section>

<section id="worker"><h1>Join as a worker</h1><p class="sub">Tell us who you are and what you do.</p>
<form id="wf"><input class="hp" name="website" tabindex="-1" autocomplete="off">
<label>Full name<input name="name" required autocomplete="name"></label>
<label>Phone<input name="phone" type="tel" required autocomplete="tel"></label>
<div class="row"><label>Position<input name="position" list="pos" placeholder="e.g. Electrician"><datalist id="pos"></datalist></label>
<label>Job title<input name="title"></label></div>
<div class="row"><label>Years of experience<input name="years" type="number" min="0" inputmode="numeric"></label>
<label>Area<input name="area" placeholder="Town / region"></label></div>
<label>Skills<textarea name="skills" rows="3"></textarea></label>
<label class="chk"><input type="checkbox" name="available" checked> I am available for work now</label>
<div class="err" id="we"></div><button class="btn p" type="submit">Register as worker</button></form></section>

<section id="supplier" hidden><h1>Join as a supplier</h1><p class="sub">List what you sell so managers can order from you.</p>
<form id="sf"><input class="hp" name="website" tabindex="-1" autocomplete="off">
<label>Company / business name<input name="company" required></label>
<div class="row"><label>Contact person<input name="contact"></label><label>Phone<input name="phone" type="tel" required></label></div>
<div class="row"><label>Category<input name="category" placeholder="e.g. Electrical"></label><label>Area<input name="area"></label></div>
<div><b>Items you supply</b><div id="items" style="display:grid;gap:6px;margin-top:6px"></div>
<button class="btn" type="button" id="addItem" style="margin-top:8px">+ Add item</button></div>
<div class="err" id="se"></div><button class="btn p" type="submit">Register as supplier</button></form></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.t));
function show(t){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
 $('done').hidden=true;$('worker').hidden=t!=='worker';$('supplier').hidden=t!=='supplier';history.replaceState(null,'','#'+t)}
function addItem(){const d=document.createElement('div');d.className='item';
 d.innerHTML='<input placeholder="Item" aria-label="Item"><input placeholder="Unit" aria-label="Unit"><input placeholder="Price" type="number" min="0" step="any" aria-label="Price"><button type="button" class="btn" aria-label="Remove">✕</button>';
 d.querySelector('button').onclick=()=>{if($('items').children.length>1)d.remove()};$('items').appendChild(d)}
$('addItem').onclick=addItem;addItem();
sb.from('positions').select('name').order('name').then(({data})=>{if(data)$('pos').innerHTML=data.map(r=>r.name).map(p=>`<option value="${p.replace(/"/g,'&quot;')}">`).join('')});
async function send(fn,errEl,form){const btn=form.querySelector('.p');btn.disabled=true;errEl.textContent='';
 try{const {error}=await fn();if(error)throw new Error('Could not save. Check your details and try again.');
  $('worker').hidden=$('supplier').hidden=true;$('done').hidden=false;form.reset()}
 catch(e){errEl.textContent=e.message}finally{btn.disabled=false}}
const v=x=>(x||'').toString().trim()||null;
$('wf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('website'))return;
 send(()=>sb.from('workers').insert({name:v(f.get('name')),phone:v(f.get('phone')),position:v(f.get('position')),title:v(f.get('title')),years:f.get('years')===''?null:+f.get('years'),area:v(f.get('area')),skills:v(f.get('skills')),available:e.target.available.checked}),$('we'),e.target)};
$('sf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(f.get('website'))return;
 const items=[...$('items').children].map(d=>{const i=d.querySelectorAll('input');return{name:v(i[0].value),unit:v(i[1].value),price:i[2].value===''?null:+i[2].value}}).filter(i=>i.name);
 if(!items.length){$('se').textContent='Add at least one item you supply.';return}
 const id=crypto.randomUUID();
 send(async()=>{const r=await sb.from('suppliers').insert({id,company:v(f.get('company')),contact:v(f.get('contact')),phone:v(f.get('phone')),category:v(f.get('category')),area:v(f.get('area'))});
  if(r.error)return r;return sb.from('supplier_items').insert(items.map(i=>({...i,supplier_id:id})))},$('se'),e.target)};
$('again').onclick=()=>show(location.hash==='#supplier'?'supplier':'worker');
if(location.hash==='#supplier')show('supplier');
</script></body></html>
